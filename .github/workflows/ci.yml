name: CI

# Bloque le merge sur main si les tests ou le build échouent (cf. flux CLAUDE.md :
# branche feature → merge sur main → déploiement Vercel). Le lint bloque sur les ERREURS
# (variable non définie, import manquant…) ; les avertissements restent informatifs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires (bloquant)
        run: npm test
      - name: Build production (bloquant)
        run: npm run build
      - name: Lint (bloquant sur les erreurs)
        run: npm run lint
